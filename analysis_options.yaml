# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints. The analyzer is run with
# `flutter analyze` and its results are shown in Dart-enabled editors.

# Use Flutter's recommended lint rules for app source files.
include: package:flutter_lints/flutter.yaml

analyzer:
  # These are generated artifacts and third-party source packages, not
  # FocusHaven source code. Analyzing them produces irrelevant errors.
  exclude:
    - build/**
    - .dart_tool/**
    - ios/Flutter/ephemeral/**
    - macos/Flutter/ephemeral/**
