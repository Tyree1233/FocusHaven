
name: focushaven
description: A calming focus timer app
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_sign_in: ^6.0.0
  shared_preferences: ^2.1.1
  in_app_purchase: ^3.0.7
  provider: ^6.0.5
  flutter_riverpod: ^3.4.2
  flutter_local_notifications: ^22.2.0
  flutter_timezone: ^5.0.1
  intl: ^0.18.0
  timezone: ^0.11.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/focushaven-logo.png
