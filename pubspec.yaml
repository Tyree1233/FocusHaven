
name: focushaven
description: A calm, local-first focus timer and wellbeing companion.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  firebase_core: ^4.13.0
  firebase_app_check: ^0.4.6
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.5
  google_sign_in: ^6.0.0
  shared_preferences: ^2.1.1
  in_app_purchase: ^3.0.7
  flutter_riverpod: ^3.4.2
  flutter_local_notifications: ^22.2.0
  flutter_timezone: ^5.0.1
  intl: ^0.18.0
  timezone: ^0.11.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  in_app_purchase_platform_interface: ^1.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/focushaven-logo.png
